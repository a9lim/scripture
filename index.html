<head>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Scripture",
      "url": "https://a9l.im/scripture/",
      "description": "Sacred text reader with twelve works from multiple traditions — KJV Old and New Testaments, Apocrypha, Quran (Pickthall), Book of Mormon, Doctrine and Covenants, Pearl of Great Price, Four Books (Legge), Tao Te Ching (Legge), Kojiki (Chamberlain), Bundahis (West), and Lotus Sutra (Kern). Features full-text search, verse-linked notes, and chapter-by-chapter navigation.",
      "applicationCategory": "EducationalApplication",
      "educationalUse": "Reading and studying sacred texts from world religious traditions",
      "learningResourceType": "TextReference",
      "educationalLevel": "General",
      "about": [
        {"@type": "Thing", "name": "Bible (King James Version)"},
        {"@type": "Thing", "name": "Quran"},
        {"@type": "Thing", "name": "Book of Mormon"},
        {"@type": "Thing", "name": "Tao Te Ching"},
        {"@type": "Thing", "name": "Kojiki"},
        {"@type": "Thing", "name": "Comparative religion"}
      ],
      "keywords": "scripture reader, Bible, Quran, Book of Mormon, Tao Te Ching, Kojiki, Bundahis, Four Books, sacred texts, religious texts, educational",
      "operatingSystem": "Any (Web Browser)",
      "browserRequirements": "Modern browser with ES6 module support",
      "author": {
        "@type": "Person",
        "name": "a9lim",
        "url": "https://a9l.im/#about",
        "sameAs": [
          "https://github.com/a9lim",
          "https://twitter.com/a9_lim"
        ]
      },
      "isPartOf": {
        "@type": "WebSite",
        "name": "a9l.im",
        "url": "https://a9l.im"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

<body class="app-ready">
    <a href="#reading-pane" class="skip-link">Skip to content</a>

    <div id="toolbar" class="sim-toolbar glass" role="toolbar" aria-label="Reader controls">
        <div class="toolbar-left">
            <a href="/" class="sim-home" title="a9l.im"><img src="/logo.svg" alt="a9l.im" height="28"></a>
            <span class="sim-brand">Scripture</span>
            <div class="toolbar-sep"></div>
            <div class="nav-dropdowns">
                <select id="work-select" class="sim-select" aria-label="Work">
                    <option value="">Work</option>
                </select>
                <select id="book-select" class="sim-select" aria-label="Book">
                    <option value="">Book</option>
                </select>
                <select id="chapter-select" class="sim-select" aria-label="Chapter">
                    <option value="">Chapter</option>
                </select>
            </div>
        </div>
        <div class="toolbar-right sim-toolbar-actions">
            <button id="random-btn" class="tool-btn" title="Random Verse" aria-label="Random verse" data-icon="dice"></button>
            <button id="download-btn" class="tool-btn" title="Download Text" aria-label="Download text file" data-icon="download"></button>
            <button id="tts-btn" class="tool-btn" title="Read Aloud" aria-label="Read chapter aloud" data-icon="speaker"></button>
            <button id="search-btn" class="tool-btn" title="Search" aria-label="Open search" data-icon="search"></button>
            <button id="resume-btn" class="tool-btn" title="Resume Reading" aria-label="Resume reading" data-icon="eye"></button>
            <button id="export-btn" class="tool-btn" title="Export Data" aria-label="Export data" data-icon="save"></button>
            <button id="import-btn" class="tool-btn" title="Import Data" aria-label="Import data" data-icon="load"></button>
            <div class="tool-sep"></div>
            <button id="theme-btn" class="tool-btn" title="Toggle Theme" aria-label="Toggle theme" data-icon="theme"></button>
            <button id="display-btn" class="tool-btn" title="Display Settings" aria-label="Display settings" data-icon="gear"></button>
            <button id="about-btn" class="tool-btn" title="About" aria-label="About" data-icon="about"></button>
            <button id="notes-toggle" class="tool-btn" title="Toggle Notes" aria-label="Toggle notes panel" aria-expanded="false" data-icon="menu"></button>
        </div>
    </div>

    <div id="app-layout">
        <main id="reading-pane" class="scrollbar-thin" tabindex="-1">
            <div id="chapter-header">
                <h1 id="chapter-title"></h1>
                <p id="chapter-subtitle"></p>
            </div>
            <div id="chapter-intro"></div>
            <div id="verses"></div>
            <div id="related-container" class="hidden">
                <button id="related-toggle" class="ghost-btn related-toggle">Related Passages</button>
                <div id="related-list" class="related-list hidden"></div>
            </div>
            <nav id="chapter-nav" aria-label="Chapter navigation">
                <a id="prev-chapter" class="ghost-btn" href="#">&larr; Previous</a>
                <div id="progress-container">
                    <div id="progress-bar"><div id="progress-fill"></div></div>
                    <span id="progress-label"></span>
                </div>
                <a id="next-chapter" class="ghost-btn" href="#">Next &rarr;</a>
            </nav>
        </main>

    </div>

    <aside id="notes-sidebar" class="sim-panel glass" role="complementary" aria-label="Notes and bookmarks">
        <div class="sheet-handle"></div>
        <div class="stats-header">
            <div class="sidebar-tabs" role="tablist" aria-label="Sidebar tabs">
                <button class="tab-btn active" data-tab="notes" role="tab" aria-selected="true">Notes</button>
                <button class="tab-btn" data-tab="bookmarks" role="tab" aria-selected="false">Bookmarks</button>
            </div>
            <button id="notes-close" class="tool-btn" title="Close panel" aria-label="Close panel" data-icon="close" data-icon-size="16"></button>
        </div>
        <div id="tab-notes" class="tab-panel active" role="tabpanel">
            <div id="notes-content" class="scrollbar-thin"></div>
        </div>
        <div id="tab-bookmarks" class="tab-panel" role="tabpanel">
            <div id="bookmarks-content" class="scrollbar-thin"></div>
        </div>
    </aside>

    <div id="search-overlay" class="sim-overlay hidden" role="dialog" aria-modal="true" aria-label="Search">
        <div class="sim-overlay-panel glass">
            <div class="overlay-header">
                <input id="search-input" type="search" class="sim-select" placeholder="Search..." aria-label="Search text">
                <button id="search-close" class="tool-btn" title="Close search" aria-label="Close search" data-icon="close" data-icon-size="16"></button>
            </div>
            <div class="search-filters">
                <select id="search-work" class="sim-select" aria-label="Filter by work"></select>
                <select id="search-book" class="sim-select" aria-label="Filter by book"></select>
                <select id="search-chapter" class="sim-select" aria-label="Filter by chapter"></select>
            </div>
            <div id="search-results" class="sim-overlay-body"></div>
        </div>
    </div>

    <div id="concordance-overlay" class="sim-overlay hidden" role="dialog" aria-modal="true" aria-label="Concordance">
        <div class="sim-overlay-panel glass">
            <div class="overlay-header">
                <input id="concordance-input" type="search" class="sim-select" placeholder="Look up a word..." aria-label="Concordance word lookup">
                <button id="concordance-close" class="tool-btn" title="Close" aria-label="Close concordance" data-icon="close" data-icon-size="16"></button>
            </div>
            <div id="concordance-results" class="sim-overlay-body"></div>
        </div>
    </div>

    <script src="/shared-tabs.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
